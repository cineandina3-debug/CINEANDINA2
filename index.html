function cargar(){
galeria.innerHTML=videos.map(v=>{
 const ref=v.tipo==="okru"?v.embed:v.id;
 return `<div class="card video"><div class="poster"><img class="portada" src="${v.portada}"><img class="hover" src="${v.hover}"><button class="play" onclick="abrirVideo('${ref}')">▶</button></div><div class="info"><h2>${v.titulo}</h2><p>${v.descripcion}</p></div></div>`;
}).join('');
}
function abrirVideo(id){
if(id.includes("ok.ru/videoembed")){
player.innerHTML=`<iframe src="${id}" allow="autoplay" allowfullscreen></iframe>`;
modal.classList.add("active");
return;
}
if(id==="ID_DEL_VIDEO")return alert("Reemplaza el ID_DEL_VIDEO.");
player.innerHTML=`<iframe src="https://drive.google.com/file/d/${id}/preview" allow="autoplay;fullscreen" allowfullscreen></iframe>`;
modal.classList.add("active");
}
function cerrarVideo(){modal.classList.remove("active");player.innerHTML=""}
modal.onclick=e=>{if(e.target===modal)cerrarVideo()}
function buscarVideos(){let q=buscar.value.toLowerCase();document.querySelectorAll('.video').forEach(v=>v.style.display=v.innerText.toLowerCase().includes(q)?'':'none')}
cargar();
