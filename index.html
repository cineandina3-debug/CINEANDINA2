<script>
const videos=[
{titulo:"Los imprevistos del amor / Love, Rosie",descripcion:"Rosie y Alex comparten una conexión de almas gemelas ligadas por un hilo rojo invisible. Sin embargo, el miedo terrenal y el orgullo los desvían de su sintonía, activando un largo viaje de aprendizaje y evolución espiritual que los separa por un océano durante 12 años.A través de matrimonios fallidos, una maternidad inesperada y la distancia, el universo los somete a duras pruebas de desapego y paciencia. ",portada:"https://i.ibb.co/DPx4YRnb/Copilot-20260731-235621.png",hover:"https://i.ibb.co/XrKZGW1g/descarga-28.jpg",id:"19TgpWXhkpgZjXyb7MPzEkKEA5xBmdAst"},
{titulo:"Eterno resplandor de una mente sin recuerdos",descripcion:"Una metáfora visual sobre el contrato álmico y la imposibilidad de evadir las lecciones del destino.",portada:"https://i.ibb.co/4Zt0nQMy/eterno-resplandor-de-una-mente-sin-recuerdos-1.jpg",hover:"https://indiehoy.com/wp-content/uploads/2024/03/eterno-resplandor-una-mente-sin-recuerdos-6-curiosidades.jpg",id:"19Ix12N7Sf9l8uN2NxuZY-5nEmeKufl05"},
{titulo:"La Ballena",descripcion:"Un crudo estudio de caso sobre el trastorno por atracón y la autolesión no suicida como mecanismos de defensa desadaptativos. La trama sigue a Charlie, un profesor de literatura cuya psique está fracturada por un trauma complejo ",portada:"https://i.ibb.co/8g4NJQgT/Copilot-20260728-234749.png",hover:"https://i.ibb.co/MKgpYyg/Copilot-20260728-234154.png",id:"1YEfItp0KchLtGjqtH6toJstWxWMF5bdw"},
{titulo:"El Método",descripcion:"siete aspirantes a un alto puesto ejecutivo son sometidos a crueles e intensas pruebas psicológicas y dinámicas de grupo, diseñadas para enfrentar a los candidatos entre sí, exponer sus inseguridades y revelar hasta dónde están dispuestos a llegar para obtener el empleo.",portada:"https://i.ibb.co/0RvRhT7N/2.jpg",hover:"https://i.ibb.co/PvhvLx3M/el-metodo.jpg",id:"1JeSNAmcEwl0cSFW5xrrgrITP_hcattcO"},
{titulo:"Mi pequeño yo - Big World",descripcion:"un joven de 20 años con parálisis cerebral que decide romper con las ataduras físicas y mentales impuestas por su condición, emprende un viaje de autodescubrimiento, logrando independizarse y reconectando con su madre.",portada:"https://i.ibb.co/SXrqKDPc/9f84a591ad.jpg",hover:"https://i.ibb.co/prhhDj9y/Copilot-20260721-000814.png",id:"1PhUDHUQP0OzNpZidUBVRXgU7j8M-61R8"},
{titulo:"Stutz",descripcion:"Sigue a Hill y a su terapeuta mientras tiene discusiones cándidas sobre la salud mental y los ataques de ansiedad cada vez más empeorados relacionados con la promoción de películas que han convertido el trabajo de sus sueños en una pesadilla.",portada:"https://i.ibb.co/k6P8Jt3H/Copilot-20260709-233104.png",hover:"https://i.ibb.co/hxH9J9PB/Copilot-20260709-232933.png",id:"19IGOYX26bSUaWJRWZH5Lgg7_DOHMvRz6"},
{titulo:"La Maison en Petits Cubes (Cortometraje)",descripcion:"Un anciano solitario, rodeado por una ciudad que lentamente se hunde bajo el agua, se aferra a su hogar construyendo pisos sobre pisos para no ser tragado por el olvido. Cuando su pipa cae hacia las profundidades, inicia un descenso que se convierte en un viaje espiritual: cada habitación sumergida revela un recuerdo, una emoción, una vida que fue. En su búsqueda, no solo recupera un objeto, sino el sentido de su existencia una inmersión poética en la memoria y la aceptación del paso del tiempo.",portada:"https://i.ibb.co/gQxFD8H/Copilot-20260713-012544.png",hover:"https://i.ibb.co/CpRcKntZ/Copilot-20260713-012502.png",id:"1hsJzNjRoP0GuW_gnUfzdNxjmoNH91lD_"},
{titulo:"Dinner for few (Cortometraje)",descripcion:"una feroz alegoría sociopolítica sobre la avaricia, la distribución de la riqueza y el colapso de los sistemas de poder.",portada:"https://i.ibb.co/XZtkTBB5/Copilot-20260713-015056.png",hover:"https://i.ibb.co/v6tXHTw0/Copilot-20260713-014933.png",id:"1yb0ns83IeoQSQyro6jfgTse8RSTXnzio"},
{titulo:"El niño, el topo, el zorro y el caballo (Cortometraje)",descripcion:"En esta historia, los personajes representan distintas facetas del alma humana, Los espectadores conectan intensamente con los consejos de los animales, que enseñan sobre la aceptación, la vulnerabilidad y la importancia de la amabilidad",portada:"https://i.ibb.co/8nvtjpCL/Copilot-20260719-235934.png",hover:"https://i.ibb.co/7xKcnPvg/Copilot-20260719-235431.png",id:"12EaVnSZiTQkw6L7ue2MSKNHH31n5LAi9"},
{titulo:"La naranja mecánica",descripcion:"Un joven sociópata en una sociedad distópica que disfruta de las drogas, la música de Beethoven y la ultraviolencia junto a su pandilla. Tras ser encarcelado por asesinato, se somete a un tratamiento psicológico experimental que le causa náuseas al presenciar la violencia, eliminando su libre albedrío para elegir entre el bien y el mal",portada:"https://i.ibb.co/B5QLJHb9/la-naranja-mecanica-kubrick-6588d81b37419.avif",hover:"https://i.ibb.co/C5Ld16S2/Copilot-20260721-000257.png",id:"1UD28wt6sEQKsFr9l1KsGe7Q3ZgXrOOJ_"},
{titulo:"Jesús Película Oficial",descripcion:"narra la vida, muerte y resurrección de Jesucristo basándose casi textualmente en el Evangelio de Lucas. Rodada en Israel con actores locales, destaca por su fidelidad bíblica.",portada:"https://i.ibb.co/QvxSQ56N/Copilot-20260721-010907.png",hover:"https://i.ibb.co/tM3BfMsd/Copilot-20260721-011141.png",id:"1Mcql9C-pl8CnBIxXc3HKET3fCe98-7Oq"},
{titulo:"Contactos de cuarto tipo",descripcion:"Ambientada en Nome, Alaska, sigue a la psicóloga Abigail Tyler, quien graba en video las sesiones de sus pacientes traumatizados, descubriendo evidencias aterradoras de abducciones extraterrestres.",portada:"https://i.ibb.co/d4HBbwhy/Copilot-20260721-114902.png",hover:"https://i.ibb.co/b5zpt1Sw/Copilot-20260721-115035.png",id:"1Jq_LXTTB-Ct1CYFeF0BZjEpUoyjgfF5Z"},
{titulo:"interestelar",descripcion:"Un futuro en el que la Tierra se vuelve inhabitable, y un grupo de astronautas viaja a través de un agujero de gusano en busca de un nuevo hogar.",portada:"https://i.ibb.co/279H1Pnv/Copilot-20260729-002110.png",hover:"https://i.ibb.co/20HQzwmx/Copilot-20260729-001956.png",id:"1MHBmWxQaFPKLIIdUDL6NXjLWr97uXvpc"},
{titulo:"La Odisea de los Giles",descripcion:"Es un apasionante thriller de justicia popular. No es la típica historia de ladrones codiciosos, sino la revancha de un grupo de laburantes de pueblo que, tras perder los ahorros de su vida en el corralito del 2001, descubren que la crisis no fue un accidente, sino una trampa de los de guante blanco.",portada:"https://i.ibb.co/0jsHpsZT/Copilot-20260729-004253.png",hover:"https://i.ibb.co/yFSsMPnk/Copilot-20260729-004137.png",id:"1yTh8LN-UsJEyv2QhEM8WZfgctEg_sQlO"},
{titulo:"El patrón: radiografía de un crimen",descripcion:"No es solo un drama policial, es un descenso directo y asfixiante hacia los sótanos de la esclavitud moderna. Basada en un caso real crudo y perturbador, la película te mete en la piel de Hermógenes, un peón de campo analfabeto que llega a Buenos Aires encandilado por la promesa de progreso.",portada:"https://i.ibb.co/yB4xPWr6/0638172138f5d84e0a7cf99137a0d3221c75ea3e938148052b7d44c8f630d0fb.png",hover:"https://i.ibb.co/3wD3qCx/elpatron.jpg",id:"1OlyeePjGp6xqNeqGYEFYMf6BEHqFh-lg"},
{titulo:"La tumba de las luciernagas",descripcion:"En los últimos meses de la Segunda Guerra Mundial en Japón. Sigue a dos hermanos huérfanos: Seita, un adolescente de 14 años, y Setsuko, su pequeña hermana de 4 años. Tras perder a su madre en un brutal bombardeo estadounidense y quedar sin hogar, ambos deben iniciar una lucha desesperada y solitaria por sobrevivir frente al hambre, las enfermedades y la profunda indiferencia de la sociedad.",portada:"https://i.ibb.co/kVqk6wH6/Copilot-20260729-120303.png",hover:"https://i.ibb.co/TxHnyDzN/Copilot-20260729-120832.png",id:"1-_xXfqr25T-IrPIrugSLleFvUn3C9VQO"},
{titulo:"hitler el ascenso del mal",descripcion:"Narra la dramática vida de Hitler desde su infancia en Austria hasta su consolidación como el gobernante supremo de Alemania. La trama se enfoca en cómo la amargura social, la crisis económica y la fragmentación política tras la Primera Guerra Mundial permitieron el crecimiento del nazismo.",portada: "https://i.ibb.co/3ymt32CP/Copilot-20260729-122558.png",hover:"https://i.ibb.co/mVYRswMN/Chat-GPT-Image-29-jul-2026-12-32-31.png",id:"1oyCAkrRTj7-WaOOGfLqaAB0Qi0GuJ0-m"},
{titulo:"Argentina 1985",descripcion:"Una la historia real del fiscal Julio Strassera, el fiscal adjunto Luis Moreno Ocampo y su joven equipo jurídico, quienes asumieron la inmensa y peligrosa tarea de llevar a cabo el histórico Juicio a las Juntas en 1985 para enjuiciar a los máximos mandos de la última dictadura militar por graves crímenes de lesa humanidad.",portada:"https://i.ibb.co/cKrhFVXX/1985.jpg",hover:"https://i.ibb.co/PGBnnDm1/Copilot-20260731-233933.png",id:"ID_DEL_VIDEO"},
{titulo:"indiferencia ( el profesor )",descripcion:"Un profesor sustituto que viaja de escuela en escuela evitando generar vínculos emocionales con sus alumnos o colegas para protegerse de su propio pasado traumático. Sin embargo, al llegar a un instituto público marginal sumido en la apatía institucional, su visión cambia por completo. Allí se convierte en un refugio para sus estudiantes desamparados, al mismo tiempo que acoge en su vida a una joven prostituta sin hogar, rompiendo sus propias barreras contra el dolor del mundo.",portada:"https://i.ibb.co/1gbGVtd/image-2.jpg",hover:"https://i.ibb.co/fYxZ16bj/image-1.jpg",id:"1iDiLp183oT94GpvVZPztL6RP61HuDYnt"},
{titulo:"La ciudad de Dios",descripcion:"el abandono del Estado transformó un proyecto de viviendas de los años 60 en un laberinto de asfalto y balas, donde la falta de educación y empleo digno pavimentó el camino para que el narcotráfico industrializado de los 70 y 80 secuestrara la infancia de generaciones enteras. Es un retrato desgarrador y urgente sobre cómo el estigma social y la violencia sistémica atrapan a los jóvenes en un círculo vicioso eterno donde, lamentablemente, los niños terminan convirtiéndose en los verdugos del mañana.",portada:"https://i.ibb.co/4njbpGNY/image-3.jpg",hover:"https://i.ibb.co/pBBV2962/Firmino-Ze-Peque-o-en-Ciudad-de-Dios.jpg",id:"1ej9xO7TqCKdOVvpPsJ4zFlatJWzNj6cl"},
{titulo:"héroe anónimo - El poder de la actitud positiva - (Cortometraje)",descripcion:"Un joven que realiza pequeños actos de bondad desinteresada, como alimentar a un perro callejero, donar dinero para la educación de una niña pobre y ayudar secretamente a sus vecinos, sin recibir dinero ni reconocimiento a cambio. Aunque las personas a su alrededor lo miran con escepticismo al principio, el protagonista demuestra que su verdadera recompensa es puramente emocional.",portada:"https://i.ibb.co/LXKvqqb6/Copilot-20260803-144612.png",hover:"https://i.ibb.co/KcQQ7s2K/image-4.jpg",id:"1L8QObE8gZLcdVdQXA1BHsaOa-Ftnl4AN"},
{titulo:"El Empleo (Cortometraje)",descripcion:"narra la rutina matutina de un hombre ordinario en un mundo literal donde los seres humanos son utilizados como objetos de uso cotidiano.",portada:"https://i.ibb.co/FLXXHWfM/image-5.jpg",hover:"https://i.ibb.co/H1ch2yV/image-6.jpg",id:"1LClRSygNd5syL-pNZw_KC5N3IsxmLDRt"},
{titulo:"El señor indiferente (Cortometraje)",descripcion:"Un hombre de negocios atrapado en el individualismo absoluto. Camina siempre apurado, con las manos metidas en los bolsillos y esquivando la mirada de cualquiera que lo rodee.",portada:"https://i.ibb.co/LzzgGzf8/image-7.jpg",hover:"https://i.ibb.co/S4kJwXyL/image-8.jpg",id:"1nrrd-SnISwgaUPLaCfbb3F6m0W_16L6z"},
,{titulo:"Invictus",descripcion:"Invictus es un emotivo drama basado en hechos reales que retrata el poder de la resiliencia humana frente al odio y la división de un país entero. Tras décadas de encierro y opresión, el nuevo presidente decide no buscar venganza, sino unir a su pueblo fracturado sanando las heridas del pasado a través del deporte.",portada:"https://i.ibb.co/WNdb95vd/22954-0.webp",hover:"https://i.ibb.co/DgDQhKFJ/invictus-1024x576.jpg",tipo:"okru",embed:"//ok.ru/videoembed/4080377399911?nochat=1"},

function normalizarYoutube(url){
  try{
    const u=new URL(url);
    let videoId="";
    if(u.hostname.includes("youtube.com")){
      if(u.pathname.startsWith("/embed/")) videoId=u.pathname.split("/embed/")[1].split("/")[0];
      else if(u.pathname==="/watch") videoId=u.searchParams.get("v")||"";
      else if(u.pathname.startsWith("/shorts/")) videoId=u.pathname.split("/shorts/")[1].split("/")[0];
    }else if(u.hostname==="youtu.be"){
      videoId=u.pathname.slice(1).split("/")[0];
    }
    if(!videoId)return null;
    return "https://www.youtube.com/embed/"+videoId+"?autoplay=1&rel=0";
  }catch(e){return null}
}

let previewTimer=null;
let previewIndex=0;
let previewImages=[];
let previewEl=null;

function prepararPreview(){
  previewImages=[];
  videos.forEach((v,i)=>{
    if(v.portada) previewImages.push({src:v.portada,index:i,tipo:"Portada"});
    if(v.hover) previewImages.push({src:v.hover,index:i,tipo:"Hover"});
  });
}

function iniciarPreview(){
  prepararPreview();
  if(!previewImages.length)return;

  const old=document.querySelector('.featured-preview');
  if(old)old.remove();

  const primerCard=galeria.querySelector('.card.video');
  if(!primerCard)return;

  const preview=document.createElement('section');
  preview.className='featured-preview';
  preview.setAttribute('aria-label','Vista previa de películas');
  preview.innerHTML=`
    <img id="previewImgA" src="${previewImages[0].src}" alt="">
    <img id="previewImgB" src="" alt="">
    <div class="preview-counter" id="previewCounter"></div>
    <div class="preview-content">
      <span class="preview-kicker" id="previewTipo">Vista previa</span>
      <h2 id="previewTitulo"></h2>
      <p id="previewDescripcion"></p>
    </div>
    <div class="preview-dots" id="previewDots"></div>
    <div class="preview-progress"><span id="previewProgressBar"></span></div>
  `;

  // Se coloca después de la primera película para ocupar exactamente
  // el espacio de las dos tarjetas superiores señaladas.
  primerCard.insertAdjacentElement('afterend', preview);
  previewEl=preview;

  const dots=document.getElementById('previewDots');
  videos.forEach((v,i)=>{
    const d=document.createElement('button');
    d.className='preview-dot';
    d.type='button';
    d.title=v.titulo;
    d.setAttribute('aria-label','Mostrar '+v.titulo);
    d.onclick=()=>{
      const pos=previewImages.findIndex(x=>x.index===i);
      if(pos>=0){
        previewIndex=pos;
        mostrarPreview(true);
      }
    };
    dots.appendChild(d);
  });

  previewIndex=0;
  mostrarPreview(false);

  clearInterval(previewTimer);
  previewTimer=setInterval(()=>{
    previewIndex=(previewIndex+1)%previewImages.length;
    mostrarPreview(true);
  },3000);
}

function mostrarPreview(animar=true){
  if(!previewEl || !previewImages.length)return;

  const item=previewImages[previewIndex];
  const v=videos[item.index];
  const a=document.getElementById('previewImgA');
  const b=document.getElementById('previewImgB');

  const actual=previewEl.dataset.active==="b" ? b : a;
  const siguiente=actual===a ? b : a;

  siguiente.src=item.src;
  siguiente.classList.add('visible');
  actual.classList.remove('visible');

  previewEl.dataset.active=actual===a ? "b" : "a";

  document.getElementById('previewTitulo').textContent=v.titulo;
  document.getElementById('previewDescripcion').textContent=v.descripcion;
  document.getElementById('previewTipo').textContent=item.tipo+" · vista previa";
  document.getElementById('previewCounter').textContent=
    (previewIndex+1)+" / "+previewImages.length;

  document.querySelectorAll('.preview-dot').forEach((d,i)=>{
    d.classList.toggle('active',i===item.index);
  });

  const bar=document.getElementById('previewProgressBar');
  if(bar){
    bar.style.animation='none';
    void bar.offsetWidth;
    bar.style.animation='previewProgress 3s linear infinite';
  }
}

function cargar(){
  galeria.innerHTML=videos.map((v,i)=>{
    return `<div class="card video">
      <div class="poster">
        <img class="portada" src="${v.portada}" alt="">
        <img class="hover" src="${v.hover}" alt="">
        <button class="play" onclick="abrirVideo(${i})" aria-label="Reproducir">▶</button>
      </div>
      <div class="info"><h2>${v.titulo}</h2><p>${v.descripcion}</p></div>
    </div>`;
  }).join('');

  iniciarPreview();
}

function abrirVideo(index){
  const v=videos[index];
  if(!v)return;

  let src="";

  // Google Drive: conserva exactamente el mecanismo original.
  if(!v.tipo || v.tipo==="drive"){
    if(v.id==="ID_DEL_VIDEO")return alert("Reemplaza el ID_DEL_VIDEO.");
    src=`https://drive.google.com/file/d/${v.id}/preview`;
  }

  // OK.ru: conserva el mecanismo original.
  else if(v.tipo==="okru"){
    src=v.embed;
  }

  // YouTube: nuevo mecanismo compatible con la galería.
  else if(v.tipo==="youtube"){
    src=normalizarYoutube(v.embed);
    if(!src)return alert("El enlace de YouTube no es válido.");
  }

  if(!src)return alert("No se pudo identificar el video.");

  const allow=v.tipo==="youtube"
    ? "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    : "autoplay;fullscreen";

  player.innerHTML=`<iframe
    src="${src}"
    title="${v.titulo.replace(/"/g,'&quot;')}"
    frameborder="0"
    allow="${allow}"
    referrerpolicy="strict-origin-when-cross-origin"
    allowfullscreen></iframe>`;

  modal.classList.add("active");
}

function cerrarVideo(){modal.classList.remove("active");player.innerHTML=""}
